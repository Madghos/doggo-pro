
[project]
name = "doggo-pro"
version = "0.1.0"
description = "MuJoCo Unitree A1 simulation with LeRobot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "daqp>=0.11.2",
    "lerobot[core-scripts]>=0.7.0",
    "mink>=1.4.0",
    "mujoco>=4.0.1",
    "numpy>=2.2.6",
    "pynput>=1.8.2",
    "torch==2.14.1+cu130",
    "torchvision==0.29.1+cu130",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
